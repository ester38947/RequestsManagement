# MongoDB single-node replica set, runnable with one command.
# A replica set is required to support transactions (bulk update + audit, concurrency) — see WORK_PLAN section 6.
#
# Start: docker compose up -d
# Stop:  docker compose down            (data is kept in the volume)
# Reset: docker compose down -v         (also deletes the data)
#
# The connection string for the application:
#   mongodb://localhost:27017/?replicaSet=rs0&directConnection=true

services:
  mongo:
    image: mongo:7.0
    container_name: requests-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initializes the replica set if not yet initialized, and reports healthy only once the node is PRIMARY.
      test: >
        mongosh --quiet --eval "
          try {
            rs.status().ok;
          } catch (e) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'localhost:27017' }]
            });
          }
          db.hello().isWritablePrimary ? 0 : 1
        "
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10
    restart: unless-stopped

volumes:
  mongo-data:
