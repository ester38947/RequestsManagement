# MongoDB single-node replica-set להרצה בלחיצה.
# Replica set נדרש לתמיכה ב-transactions (bulk update + audit, concurrency) — ראה WORK_PLAN סעיף 6.
#
# הרצה:   docker compose up -d
# עצירה:  docker compose down            (הנתונים נשמרים ב-volume)
# איפוס:  docker compose down -v         (מוחק גם את הנתונים)
#
# ה-connection string לאפליקציה:
#   mongodb://localhost:27017/?replicaSet=rs0&directConnection=true

services:
  mongo:
    image: mongo:7.0
    container_name: requests-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # מאתחל את ה-replica set אם עדיין לא אותחל, ומדווח בריא רק כשהצומת הוא PRIMARY.
      test: >
        mongosh --quiet --eval "
          try {
            rs.status().ok;
          } catch (e) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'localhost:27017' }]
            });
          }
          db.hello().isWritablePrimary ? 0 : 1
        "
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10
    restart: unless-stopped

volumes:
  mongo-data:
